<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(148, 163, 184, 0.07); stroke-width: 1; }
    .ecg-line {
      fill: none;
      stroke: #06b6d4;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawECG 4s linear infinite;
    }
    .ecg-glow {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 6;
      opacity: 0.35;
      filter: blur(4px);
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawECG 4s linear infinite;
    }
    @keyframes drawECG {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-orb {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.95); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.55; }
    }

    .float-badge {
      animation: floatAnim 4s ease-in-out infinite alternate;
    }
    .float-badge-2 {
      animation: floatAnim 4s ease-in-out infinite alternate;
      animation-delay: -2s;
    }
    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="180" r="140" fill="#06b6d4" class="pulse-orb" filter="url(#glow)" />
  <circle cx="1000" cy="160" r="130" fill="#8b5cf6" class="pulse-orb" filter="url(#glow)" />

  <!-- Dynamic ECG Rhythm Wave in Background (stays behind cards/text) -->
  <path class="ecg-glow" d="M 0 290 L 180 290 L 210 260 L 230 320 L 260 210 L 290 350 L 320 280 L 350 290 L 520 290 L 550 250 L 570 330 L 600 200 L 630 350 L 660 270 L 690 290 L 860 290 L 890 260 L 910 320 L 940 210 L 970 350 L 1000 280 L 1030 290 L 1200 290" />
  <path class="ecg-line" d="M 0 290 L 180 290 L 210 260 L 230 320 L 260 210 L 290 350 L 320 280 L 350 290 L 520 290 L 550 250 L 570 330 L 600 200 L 630 350 L 660 270 L 690 290 L 860 290 L 890 260 L 910 320 L 940 210 L 970 350 L 1000 280 L 1030 290 L 1200 290" />

  <!-- Foreground Container Card (Ensures complete clarity and readability) -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="270" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <g transform="translate(40, 32)">
      <rect width="210" height="28" rx="14" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#06b6d4">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18" class="pill-text">HEALTHCARE AI &amp; LLMS</text>
    </g>

    <!-- Main Title -->
    <text x="40" y="105" class="title-text">Awesome Medical AI &amp; Healthcare LLMs</text>
    
    <!-- Subtitle -->
    <text x="40" y="142" class="subtitle-text">Curated Ecosystem of Clinical LLMs, Ambient Documentation &amp; Medical Reasoning Systems</text>

    <!-- Key Metric / Category Dynamic Badges (Foreground Right & Lower) -->
    <g class="float-badge" transform="translate(40, 180)">
      <!-- Pill 1: Ambient Scribes -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="18" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🩺 Ambient Scribes</text>
      </g>
      <!-- Pill 2: Clinical Decision Support -->
      <g transform="translate(195, 0)">
        <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.2" />
        <text x="18" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🧠 Clinical Reasoning</text>
      </g>
      <!-- Pill 3: Open-Source Models -->
      <g transform="translate(420, 0)">
        <rect width="180" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1.2" />
        <text x="18" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔬 Open Models &amp; NLP</text>
      </g>
    </g>

    <!-- Side Graphic Stat Cards -->
    <g class="float-badge-2" transform="translate(860, 35)">
      <rect width="180" height="75" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="20" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">MARKET ESTIMATE</text>
      <text x="20" y="58" font-family="sans-serif" font-size="22" font-weight="800" fill="#38bdf8">$36B - $52B+</text>
    </g>

    <g class="float-badge" transform="translate(860, 125)">
      <rect width="180" height="75" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <text x="20" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ECOSYSTEM</text>
      <text x="20" y="58" font-family="sans-serif" font-size="20" font-weight="800" fill="#a78bfa">SaaS + Open Source</text>
    </g>

    <!-- Inner Border Glow Line -->
    <rect x="0" y="266" width="1080" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
